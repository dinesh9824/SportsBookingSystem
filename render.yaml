services:
  - type: web
    name: sports-booking-system
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan storage:link && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=${PORT}
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: SportsSystem
      - key: APP_URL
        value: https://sports-booking-system.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d08qosruibrs73ck1gug-a
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: sportsleasing
      - key: DB_USERNAME
        value: sportsleasing_user
      - key: DB_PASSWORD
        value: NI0vbytzq0269gepTlXI9Hf9S7NMDkDc 