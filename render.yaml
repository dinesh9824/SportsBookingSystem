services:
  - type: web
    name: sports-booking-system
    runtime: php
    buildCommand: curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && composer install --no-dev --optimize-autoloader && php artisan key:generate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link && php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=${PORT}
    env: php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: PHP_VERSION
        value: 8.3
      - key: COMPOSER_ALLOW_SUPERUSER
        value: 1 